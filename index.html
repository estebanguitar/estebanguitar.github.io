<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234a5568'/%3E%3Crect x='3' y='9' width='2.4' height='4' fill='%23fff'/%3E%3Crect x='6.8' y='6' width='2.4' height='7' fill='%23fff'/%3E%3Crect x='10.6' y='3.5' width='2.4' height='9.5' fill='%23fff'/%3E%3C/svg%3E"><style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--mut:#6b6b66;--line:#e4e4e0;--card:#fff;--acc:#2a5db0;
--g0:#1f7a4d;--g1:#8a5a00;--g2:#2a5db0;--g3:#7a5cad;--g4:#6b6b66;--g5:#9a9a94;}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#16161a;--fg:#e9e9e6;--mut:#9a9a94;
--line:#2c2c32;--card:#1e1e24;--acc:#7aa6e8;--g0:#5fd19a;--g1:#e0b05a;--g2:#7aa6e8;--g3:#b393e0;--g4:#9a9a94;--g5:#6b6b66;}}
:root[data-t=dark]{--bg:#16161a;--fg:#e9e9e6;--mut:#9a9a94;--line:#2c2c32;--card:#1e1e24;--acc:#7aa6e8;
--g0:#5fd19a;--g1:#e0b05a;--g2:#7aa6e8;--g3:#b393e0;--g4:#9a9a94;--g5:#6b6b66;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
#src{padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11.5px}
#src.on{color:var(--g0);border-color:currentColor}
#src.off{color:var(--mut)}
#src.err{color:#c4553a;border-color:currentColor}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;
background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;
padding:5px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip b{font-variant-numeric:tabular-nums;margin-left:5px;opacity:.75}
#q{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);color:var(--fg);
border-radius:8px;padding:6px 11px;font-size:13px}
.sec{margin:26px 0 10px;font-size:13px;font-weight:600;color:var(--mut);
text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.hd:hover{background:color-mix(in oklab,var(--card) 88%,var(--fg))}
.nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.G진행중{color:var(--g0)}.G고민중{color:var(--g1)}.G지원권고{color:var(--g2)}
.G조건부{color:var(--g3)}.G보류{color:var(--g4)}.G종료{color:var(--g5)}
.meta{font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.hh{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:1px 4px;
 margin-right:5px;color:#7c2d12;background:#fed7aa;border:1px solid #fb923c}
.np{display:inline-block;font-size:10px;border-radius:3px;padding:1px 4px;margin-right:5px;
 color:#6b7280;background:#f3f4f6;border:1px solid #d1d5db}
.ax{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:1px 4px;
 margin-right:5px;letter-spacing:-.2px;border:1px solid}
.X4{color:#15803d;border-color:#15803d}.X3{color:#0369a1;border-color:#0369a1}
.X2{color:#6b7280;border-color:#9ca3af}.X1,.X0{color:#b45309;border-color:#f59e0b;background:#fffbeb}
.ft{display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:11px;
 border-radius:3px;padding:1px 5px;margin-right:5px;color:#fff;letter-spacing:-.2px}
.F4{background:#15803d}.F3{background:#0369a1}.F2{background:#a16207}.F1{background:#6b7280}
.st2{display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:11px;
 border-radius:3px;padding:0 4px;margin-right:5px;letter-spacing:-.2px;border:1.5px solid;background:#fff}
.S4{color:#15803d;border-color:#15803d}.S3{color:#0369a1;border-color:#0369a1}
.S2{color:#a16207;border-color:#d97706}.S1{color:#b91c1c;border-color:#dc2626;background:#fef2f2}
.fn{flex-basis:100%;font-size:11px;color:var(--mut);margin-top:2px;opacity:.85}
.card.open .fn{display:none}
.pr{display:inline-block;min-width:17px;text-align:center;font-weight:700;font-size:11px;border-radius:3px;padding:1px 4px;margin-right:5px;color:#fff}.PS{background:#b91c1c}.PA{background:#c2410c}.PB{background:#0369a1}.PC{background:#6b7280}
.bm{color:#e0a020}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.jobs{margin:12px 0 4px;display:flex;flex-direction:column;gap:5px}
.job{font-size:13px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.job a{color:var(--acc);text-decoration:none}.job a:hover{text-decoration:underline}
.pf{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}
.pv{font-size:11px;border-radius:9px;padding:1px 7px;margin-right:5px;color:#fff;white-space:nowrap}
.pv.v0{background:#2e7d32}.pv.v1{background:#ef6c00}.pv.v2{background:#616161}.pv.v3{background:#c62828}
.more{margin-top:6px}
.more>summary{cursor:pointer;font-size:12px;color:var(--mut);padding:4px 0;list-style:none;user-select:none}
.more>summary::before{content:'▸ ';}
.more[open]>summary::before{content:'▾ ';}
.more>summary:hover{color:var(--fg)}
.more.inline{display:inline}
.more.inline>summary{display:inline;font-size:12px}
.ws{font-size:10px;border-radius:4px;padding:1px 6px;margin-left:5px;border:1px solid var(--line);color:var(--mut)}
.ws.w2{border-color:#8a6d3b;color:#8a6d3b}.ws.w3{border-color:#999;color:#999}
.rc{font-size:10px;color:var(--mut);margin-left:4px}
.jd{font-size:11px;color:var(--mut);line-height:1.5;margin-top:4px;padding-left:2px;border-left:2px solid var(--line);padding-left:8px}
.dl{color:#c4553a;font-size:12px;white-space:nowrap}
.dl.soon{font-weight:700}
.dl.done{color:var(--mut);font-weight:400}
.job.expired{opacity:.45}
.job.expired a{color:var(--mut);text-decoration:line-through}
.job.expired .pf{border-style:dashed}
.allexp{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid #c4553a;color:#c4553a;white-space:nowrap}
.rnd{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.rnd:first-of-type{border-top:0}
.rh{font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.why{font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.72}
.doc{font-size:11.5px;color:var(--mut);margin-top:6px;font-family:ui-monospace,monospace}
.sm{flex-basis:100%;font-size:12px;color:var(--mut);line-height:1.45;margin-top:3px;
 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.open .sm{display:none}
.app{background:color-mix(in oklab,var(--g0) 10%,transparent);border-left:3px solid var(--g0);
padding:9px 12px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13px}
.app .st{font-weight:600;color:var(--g0)}
.none{color:var(--mut);font-size:13px;padding:14px}
mark{background:#ffe49a;color:#1a1a18;border-radius:2px}
.top{position:fixed;right:18px;bottom:18px;background:var(--acc);color:#fff;border:0;
border-radius:999px;padding:9px 15px;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.gate{max-width:380px;margin:16vh auto;text-align:center}
.gate button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 20px;
font-size:14px;cursor:pointer}
.gate p{color:var(--mut);font-size:13px}
#out{color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline;background:0;border:0}
</style></head><body>
<div class="gate" id="gate">
  <h1>대시보드</h1>
  <p id="gmsg">로그인이 필요합니다.</p>
  <button id="gbtn">Google 계정으로 로그인</button>
</div>
<div class="wrap" id="app" hidden>
<h1>대시보드</h1>
<div class="sub"><span id="gen">-</span> 기준 · 판정 <span id="tot">-</span>건 ·
<span id="cnt"></span> · <span id="src" class="off">확인 중…</span> · <button id="out">로그아웃</button></div>
<div class="bar" id="bar"><input id="q" placeholder="회사명·판정근거 검색"></div>
<div id="list"></div></div>
<button class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑ 위로</button>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, get }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

let D=[], C={}, q='';
const ORD=["진행중", "고민중", "지원권고", "조건부", "미검토", "보류", "종료"];
let active=new Set(ORD.filter(g=>g!=='종료'));
const bar=document.getElementById('bar'), list=document.getElementById('list');
function chips(){
 bar.querySelectorAll('.chip').forEach(n=>n.remove());
 ORD.forEach(g=>{const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',active.has(g));b.innerHTML=g+'<b>'+(C[g]||0)+'</b>';
  b.onclick=async()=>{active.has(g)?active.delete(g):active.add(g);
   b.setAttribute('aria-pressed',active.has(g));
   // 🔴 종료는 첫 로드에서 빠져 있다. 처음 켤 때만 내려받아 덧붙인다
   if(g==='종료'&&active.has(g)&&typeof loadDead==='function'&&!window.__deadOn){
     window.__deadOn=1; b.disabled=true; const o=b.innerHTML; b.innerHTML='종료<b>…</b>';
     try{ await loadDead(); }catch(e){ window.__deadOn=0; }
     b.disabled=false; b.innerHTML=o;}
   render();};
  bar.insertBefore(b,document.getElementById('q'));});}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render();};
// 카드 펼침은 이벤트 위임 — 인라인 onclick 은 module 스코프에서 안 잡힌다
list.addEventListener('click',e=>{const h=e.target.closest('.hd');
 if(h&&!e.target.closest('a')) h.parentNode.classList.toggle('open');});
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
// 공고 마감까지 남은 일수. 날짜가 없거나 상시채용이면 null
function dday(x){ if(!x||!/^\d{4}-\d{2}-\d{2}$/.test(x)) return null;
 const d=new Date(x+'T00:00:00'); return Math.round((d-TODAY)/86400000); }
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s){if(!q)return esc(s);
 return esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>');}
function render(){
 // 🔴 등록된 공고가 없는 회사는 지원할 길이 없다. 화면에서 뺀다.
 //    검색어를 넣으면 다시 보여 과거 판정을 찾을 수 있게 둔다.
 let rows=D.filter(d=>active.has(d.g)&&(q||!d.np));
 if(q){const t=q.toLowerCase();
  rows=rows.filter(d=>d.c.toLowerCase().includes(t)||(d.sm||'').toLowerCase().includes(t)
    ||(d.hh&&'헤드헌터헤드헌팅'.includes(t))||(d.np&&'공고없음'.includes(t))
    ||(d.sd||'').toLowerCase().includes(t)
  ||d.h.some(h=>(h.why||'').toLowerCase().includes(t)));}
 document.getElementById('cnt').textContent='표시 '+rows.length+'곳';
 let out='',cur='';
 for(const d of rows){
  if(d.g!==cur){cur=d.g;out+='<div class="sec">'+cur+'</div>';}
  const bm=d.p.some(p=>p.bm)?'<span class="bm" title="북마크">★</span>':'';
  const allExp=d.p.length&&d.p.every(p=>{const n=dday(p.dl);return n!==null&&n<0;})
    ?'<span class="allexp" title="등록된 공고가 모두 마감됨">공고 마감</span>':'';
  out+='<div class="card"><div class="hd">'
   +'<span class="tag G'+d.g+'">'+esc(d.v)+'</span>'
   +(d.ws&&d.ws!=='완료'?'<span class="ws '+({'조사대기':'w2','마감':'w3'}[d.ws]||'')+'" title="작업 상태 — 조사대기는 축을 채우면 등급이 올라갈 수 있다">'+esc(d.ws)+'</span>':'')
   +(d.ft!=null?'<span class="ft F'+(d.ft>=75?4:d.ft>=60?3:d.ft>=45?2:1)+'" title="직무적합도 '+d.ft
       +' — 스택 40% · 도메인 30% · 경력요건 20% · 공고 충실도 10%'+(d.fn?'&#10;'+esc(d.fn):'')+'">'+d.ft+'</span>':'')
   +(d.st!=null?'<span class="st2 S'+(d.st>=70?4:d.st>=55?3:d.st>=40?2:1)+'" title="기업안정성 '+d.st
       +' — 재무 40% · 평판 30% · 인원 20% · 연봉 10%. 확인하지 못한 축은 50점 중립으로 넣는다'
       +(d.sd?'&#10;'+esc(d.sd):'')+'">'+d.st+'</span>':'')
   +(d.hh?'<span class="hh" title="헤드헌터 경유 공고 — 실제 채용 회사가 공개되지 않는다">헤드헌터</span>':'')
   +(d.np?'<span class="np" title="등록된 공고가 없다 — 지원 경로를 직접 찾아야 한다">공고없음</span>':'')
   +(d.ft!=null&&d.ax!=null?'<span class="ax X'+d.ax+'" title="실사 충실도 — 재무·평판·인원·연봉 4축 중 '
       +d.ax+'개 확인. 🔴 적합도 점수는 공고 정보만 보므로 평판·재무 위험은 담기지 않는다">'
       +(d.ax>=3?'✓':'⚠')+d.ax+'축</span>':'')
   +'<span class="nm">'+hl(d.c)+' '+bm+'</span>'+allExp
   +'<span class="meta">'+(d.rd?d.rd+'차 ':'')+esc(d.dt)+'</span>'
   +(d.sm?'<div class="sm">'+hl(d.sm)+'</div>':'')
   +(d.fn?'<div class="fn">적합도 '+d.ft+(d.st!=null?' · 안정 '+d.st:'')+' · '+esc(d.fn)+'</div>':'')+'</div><div class="body">';
  for(const a of d.a){
   out+='<div class="app"><span class="st">'+esc(a.st)+'</span> · '+esc(a.on)+' 지원'
    +(a.pf?' · '+esc(a.pf):'')+(a.t?'<br>'+esc(a.t):'')
    +(a.note?'<div class="why" style="margin-top:7px">'+hl(a.note)+'</div>':'')+'</div>';}
  const PVC={'지원권고':'v0','조건부':'v1','보류':'v2','제외':'v3'};
  const pvb=p=>p.pv?('<span class="pv '+(PVC[p.pv]||'v2')+'">'+esc(p.pv)+'</span>'
    +(p.rc?'<span class="rc">'+esc(p.rc.replace(/,/g,' · '))+'</span>':'')):'';
  if(d.p.length){out+='<div class="jobs">';
   const ps=d.p.slice().sort((a,b)=>(dday(a.dl)===null?0:dday(a.dl)<0?1:0)-(dday(b.dl)===null?0:dday(b.dl)<0?1:0));
   for(const p of ps){const n=dday(p.dl), ex=n!==null&&n<0;
    out+='<div class="job'+(ex?' expired':'')+'">'+pvb(p)+'<span class="pf">'+esc(p.pf)+'</span>'
    +(p.u?'<a href="'+esc(p.u)+'" target="_blank" rel="noopener">'+esc(p.t||p.jid)+'</a>':esc(p.t||p.jid))
    +(p.dl?'<span class="dl'+(ex?' done':(n!==null&&n<=7?' soon':''))+'">'
        +(ex?'마감됨 '+esc(p.dl):'마감 '+esc(p.dl)+(n!==null?' (D-'+n+')':''))+'</span>':'')
    +(p.bm?'<span class="bm">★북마크</span>':'')
    +(p.jd?'<div class="jd">'+esc(p.jd)+'</div>':'')+'</div>';}
   out+='</div>';}
  // 🔴 이력이 카드당 평균 4.9건·2,111자라 스크롤이 길었다. 최신 1건만 펼치고 나머지는 접는다.
  //    검색 중에는 찾는 말이 옛 이력에 있을 수 있으므로 모두 펼친다.
  const hs=d.h.slice().reverse();
  // 🔴 최신 이력 한 건도 평균 503자다. 600자에서 자르고 나머지는 펼쳐 보게 한다.
  const CUT=600;
  const body=w=>{
   if(q||!w||w.length<=CUT) return '<div class="why">'+hl(w)+'</div>';
   let i=w.lastIndexOf('. ',CUT); if(i<CUT*0.5) i=w.lastIndexOf('다 ',CUT);
   const head=w.slice(0,i>CUT*0.5?i+1:CUT);
   return '<div class="why">'+hl(head)+'<details class="more inline"><summary>더보기</summary>'
     +hl(w.slice(head.length))+'</details></div>';};
  const one=h=>'<div class="rnd"><div class="rh">'+(h.r?h.r+'차 · ':'')+esc(h.d)+' · '+esc(h.v)+'</div>'
    +body(h.why)
    +(h.doc?'<div class="doc">'+esc(h.doc)+'</div>':'')+'</div>';
  if(q||hs.length<=1){ for(const h of hs) out+=one(h); }
  else{
   out+=one(hs[0]);
   if(hs.length>1){
    out+='<details class="more"><summary>이전 실사 '+(hs.length-1)+'건 보기</summary>';
    for(const h of hs.slice(1)) out+=one(h);
    out+='</details>';}
  }
  out+='</div></div>';}
 list.innerHTML=out||'<div class="none">해당하는 회사가 없습니다.</div>';}
function load(j,label,cls){
 D=j.data; C=j.counts;
 document.getElementById('gen').textContent=j.gen;
 document.getElementById('tot').textContent=(j.tot||0).toLocaleString();
 const s=document.getElementById('src'); s.className=cls; s.textContent=label;
 chips(); render();}

const app=initializeApp({"apiKey": "AIzaSyBn39w96xLCeYGnMf-_n2jqtLitta4e3c8", "authDomain": "wm-job.firebaseapp.com", "databaseURL": "https://wm-job-default-rtdb.asia-southeast1.firebasedatabase.app", "projectId": "wm-job", "storageBucket": "wm-job.firebasestorage.app", "messagingSenderId": "139074953448", "appId": "1:139074953448:web:d08fb9affeecc32495e95d"}), auth=getAuth(app), db=getDatabase(app);
const gate=document.getElementById('gate'), appEl=document.getElementById('app'),
      gmsg=document.getElementById('gmsg');
document.getElementById('gbtn').onclick=()=>
  signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>gmsg.textContent='로그인 실패: '+e.code);
document.getElementById('out').onclick=()=>signOut(auth);
async function pull(path){
  const snap=await get(ref(db,path));
  if(!snap.exists()) throw new Error('데이터 없음 — 로컬에서 jobdash-push 를 먼저 실행하세요');
  const b64=snap.val();
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream()
              .pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
