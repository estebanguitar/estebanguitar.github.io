<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타일 비교 — Interior Compare</title>
<meta name="description" content="카탈로그 전 타일을 카테고리·브랜드·규격·마감·색상으로 필터링해 이미지로 비교합니다.">
<style>
:root{--bg:#EAE8E4;--surface:#F9F9F7;--surface-h:#F1F0EC;--text-1:#1C1917;--text-2:#6C6962;--text-3:#A09B97;--accent:#3A5F4E;--accent-bg:#E8F0EC;--border:#D2CFCB;--f:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--text-1);line-height:1.5;font-size:14px}
/* HEADER */
.ph{background:var(--text-1);padding:1.75rem 2rem 1.5rem;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start}
.ph h1{font-size:1.35rem;font-weight:700;letter-spacing:-0.03em;color:#fff;line-height:1.15;margin-bottom:.2rem}
.ph-sub{font-size:.68rem;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.chip{border:1px solid rgba(255,255,255,.18);padding:.22rem .65rem;font-size:.72rem;color:rgba(255,255,255,.82);display:flex;align-items:center;gap:.35rem}
.chip-k{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.chip-v{font-weight:600}
.diag{display:block}
/* FILTER BAR */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:44px;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fbar-inner{max-width:1280px;margin:0 auto;padding:.6rem 1.5rem;display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
.fg{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.fl{font-size:.6rem;color:var(--text-3);font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.fchips{display:flex;gap:.2rem;flex-wrap:wrap}
.fc{border:1px solid var(--border);background:none;padding:.2rem .55rem;font-size:.68rem;font-family:var(--f);cursor:pointer;color:var(--text-2);transition:all .12s;line-height:1.4;display:inline-flex;align-items:center;gap:.3rem}
.fc:hover{background:var(--surface-h);border-color:var(--text-3)}
.fc.on{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.fc .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex-shrink:0}
.fexp{border:1px solid var(--border);background:var(--surface);padding:.2rem .55rem;font-size:.68rem;font-family:var(--f);color:var(--text-2);cursor:pointer;height:26px;display:inline-flex;align-items:center;gap:.32rem;transition:all .12s}
.fexp:hover{border-color:var(--text-3)}
.fexp.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.fexp .fx{font-weight:700;opacity:.5;transition:transform .15s;font-size:.8rem;line-height:1}
.fexp.open .fx{transform:rotate(45deg)}
.fexp .fn{background:var(--accent);color:#fff;border-radius:8px;padding:0 .32rem;font-size:.6rem;font-weight:700;min-width:14px;text-align:center;line-height:1.5}
.fpanel{flex-basis:100%;width:100%;padding:.55rem 0 .15rem;margin-top:.4rem;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:.28rem;align-items:center;max-height:46vh;overflow-y:auto}
.fpanel[hidden]{display:none}
.fpanel .fgh{flex-basis:100%;font-size:.58rem;color:var(--text-3);font-weight:700;letter-spacing:.06em;margin:.35rem 0 .05rem}
.fpanel .fgh:first-child{margin-top:0}
.fc .cn{opacity:.45;font-size:.9em;margin-left:.1rem}
.fsearch{border:1px solid var(--border);background:var(--surface);padding:.2rem .55rem;font-size:.68rem;font-family:var(--f);color:var(--text-1);width:160px;outline:none;height:26px}
.fsearch:focus{border-color:var(--accent)}
.fcount{margin-left:auto;font-size:.69rem;color:var(--text-3);display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.fcount b{color:var(--text-1);font-weight:800;font-variant-numeric:tabular-nums}
.freset{border:none;background:none;font-size:.67rem;color:var(--accent);cursor:pointer;text-decoration:underline;font-family:var(--f);padding:0}
/* GALLERY */
.main{max-width:1280px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.card{background:var(--surface);display:flex;flex-direction:column;cursor:pointer;transition:background .1s;overflow:hidden}
.card:hover{background:var(--surface-h)}
.cimg{aspect-ratio:3/4;overflow:hidden;background:var(--bg);position:relative}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .cimg img{transform:scale(1.05)}
.ccat{position:absolute;top:.5rem;left:.5rem;background:rgba(28,25,23,.78);color:#fff;font-size:.58rem;font-weight:700;letter-spacing:.03em;padding:.14rem .45rem;backdrop-filter:blur(2px)}
.cbody{padding:.7rem .8rem .85rem;display:flex;flex-direction:column;gap:.28rem;flex:1}
.cbrand{font-size:.56rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname{font-size:.78rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--text-1)}
.cmeta{margin-top:auto;padding-top:.5rem;display:flex;align-items:center;gap:.4rem;font-size:.66rem;color:var(--text-2);flex-wrap:wrap}
.csize{font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums}
.cfin{color:var(--text-3)}
.cdot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex-shrink:0;margin-left:auto}
.no-result{text-align:center;padding:5rem 1rem;color:var(--text-3);font-size:.9rem}
/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:500;background:rgba(20,18,16,.86);display:none;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(3px)}
.lb.open{display:flex}
.lb-card{background:var(--surface);max-width:760px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.lb-img{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:320px}
.lb-img img{width:100%;height:100%;object-fit:cover;display:block}
.lb-info{padding:1.5rem 1.6rem;display:flex;flex-direction:column;gap:.15rem;position:relative}
.lb-close{position:absolute;top:.7rem;right:.9rem;border:none;background:none;font-size:1.4rem;line-height:1;color:var(--text-3);cursor:pointer;padding:.2rem}
.lb-close:hover{color:var(--text-1)}
.lb-cat{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lb-brand{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-weight:700;margin-top:.5rem}
.lb-name{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:.1rem 0 .2rem;text-wrap:balance}
.lb-color{font-size:.75rem;color:var(--text-2);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem}
.lb-specs{display:grid;grid-template-columns:5.5rem 1fr;gap:.32rem .5rem;font-size:.76rem;border-top:1px solid var(--border);padding-top:.8rem;margin-top:.3rem}
.lb-k{color:var(--text-3);font-size:.7rem}
.lb-v{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--border);padding:1.25rem 1.5rem;text-align:center;font-size:.67rem;color:var(--text-3)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.ph{grid-template-columns:1fr}.diag{display:none}.fbar-inner{gap:.35rem}.fsearch{width:120px}.lb-card{grid-template-columns:1fr}}
</style>
<script src="/nav.js"></script>
</head>

const COLOR_HEX={"화이트":"#F4F3EF","아이보리":"#EDE6D6","베이지":"#D8C6A6","그레이":"#ABA8A3","차콜":"#565452","블랙":"#1C1A18","브라운":"#7A5433","우드":"#B98D5B","그린":"#6E8B6E","블루":"#6E86A8","멀티":"linear-gradient(135deg,#c99 0%,#9c9 50%,#99c 100%)"};
const CAT_ORDER=["포세린","벽타일","바닥타일","모자이크타일","패턴타일","우드타일","비비드타일","솔리드타일","계단타일","포인트","젠다이","석재타일","고강도타일","안전타일","아키타일"];

const uniq=a=>[...new Set(a)];
const sizeArea=s=>{const m=String(s).match(/(\d+)\s*[xX]\s*(\d+)/);return m?(+m[1])*(+m[2]):0;};
const catRank=c=>{const i=CAT_ORDER.indexOf(c);return i<0?999:i;};

// state
const state={cat:new Set(),color:new Set(),finish:new Set(),brand:new Set(),size:new Set(),q:""};

// build filter options
const cats=uniq(TILES.map(t=>t.category).filter(Boolean)).sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b,'ko'));
const colors=uniq(TILES.map(t=>t.colorFamily).filter(Boolean)).sort((a,b)=>{const o=Object.keys(COLOR_HEX);return o.indexOf(a)-o.indexOf(b);});
const finishes=uniq(TILES.map(t=>t.finish).filter(Boolean)).sort((a,b)=>a.localeCompare(b,'ko'));
const maxEdge=s=>{const m=String(s).match(/(\d+)\D+(\d+)/);return m?Math.max(+m[1],+m[2]):0;};
const countBy=k=>{const m={};TILES.forEach(t=>{const v=t[k];if(v)m[v]=(m[v]||0)+1;});return m;};
const brandCnt=countBy('brand'), sizeCnt=countBy('size');
const brands=uniq(TILES.map(t=>t.brand).filter(Boolean)).sort((a,b)=>brandCnt[b]-brandCnt[a]||a.localeCompare(b,'ko'));
const sizes=uniq(TILES.map(t=>t.size).filter(Boolean));
const SIZE_TIERS=[["대형 슬래브 (장변 1800mm↑)",s=>maxEdge(s)>=1800],["대형 (1000~1799mm)",s=>maxEdge(s)>=1000],["중형 (500~999mm)",s=>maxEdge(s)>=500],["소형·모자이크 (500mm 미만)",()=>true]];

function chipBtn(container,group,val,label,dotHex,count){
  const b=document.createElement('button');
  b.className='fc';b.dataset.v=val;
  if(dotHex){const d=document.createElement('span');d.className='dot';d.style.background=dotHex;b.appendChild(d);}
  b.appendChild(document.createTextNode(label));
  if(count!=null){const s=document.createElement('span');s.className='cn';s.textContent=count;b.appendChild(s);}
  b.onclick=()=>{const s=state[group];s.has(val)?s.delete(val):s.add(val);b.classList.toggle('on');syncExp();render();};
  container.appendChild(b);
}
cats.forEach(c=>chipBtn(document.getElementById('f-cat'),'cat',c,c));
colors.forEach(c=>chipBtn(document.getElementById('f-color'),'color',c,c,COLOR_HEX[c]||'#ccc'));
finishes.forEach(f=>chipBtn(document.getElementById('f-finish'),'finish',f,f));

// brand panel — multi-select chips, most-common first
const pBrand=document.getElementById('panel-brand');
brands.forEach(b=>chipBtn(pBrand,'brand',b,b,null,brandCnt[b]));
// size panel — grouped by size tier for browsability
const pSize=document.getElementById('panel-size'); const usedS=new Set();
SIZE_TIERS.forEach(([label,test])=>{
  const grp=sizes.filter(s=>!usedS.has(s)&&test(s)).sort((a,b)=>sizeCnt[b]-sizeCnt[a]||maxEdge(b)-maxEdge(a));
  if(!grp.length)return;
  const h=document.createElement('div');h.className='fgh';h.textContent=label;pSize.appendChild(h);
  grp.forEach(s=>{usedS.add(s);chipBtn(pSize,'size',s,s,null,sizeCnt[s]);});
});

// expand/collapse toggles (only one panel open at a time)
function setupExp(btnId,panelId){
  const btn=document.getElementById(btnId),panel=document.getElementById(panelId);
  btn.onclick=e=>{e.stopPropagation();const willOpen=panel.hasAttribute('hidden');
    document.querySelectorAll('.fpanel').forEach(p=>p.setAttribute('hidden',''));
    document.querySelectorAll('.fexp').forEach(b=>b.classList.remove('open'));
    if(willOpen){panel.removeAttribute('hidden');btn.classList.add('open');btn.setAttribute('aria-expanded','true');}
    else btn.setAttribute('aria-expanded','false');
  };
}
setupExp('f-brand-btn','panel-brand');
setupExp('f-size-btn','panel-size');
function syncExp(){
  [['f-brand-btn','brand','f-brand-n'],['f-size-btn','size','f-size-n']].forEach(([bid,g,nid])=>{
    const btn=document.getElementById(bid),n=document.getElementById(nid),c=state[g].size;
    btn.classList.toggle('on',c>0); n.hidden=!c; n.textContent=c;
  });
}
// click outside filter bar closes any open panel
document.addEventListener('click',e=>{if(!e.target.closest('.fbar')){
  document.querySelectorAll('.fpanel').forEach(p=>p.setAttribute('hidden',''));
  document.querySelectorAll('.fexp').forEach(b=>{b.classList.remove('open');b.setAttribute('aria-expanded','false');});
}});

document.getElementById('f-search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render();};
document.getElementById('reset').onclick=()=>{
  state.cat.clear();state.color.clear();state.finish.clear();state.brand.clear();state.size.clear();state.q="";
  document.querySelectorAll('.fc.on').forEach(b=>b.classList.remove('on'));
  document.getElementById('f-search').value="";
  syncExp();render();
};

// header counts
document.getElementById('hcnt').textContent=TILES.length;
document.getElementById('hcat').textContent=cats.length;
document.getElementById('hbrand').textContent=brands.length;
document.getElementById('hsize').textContent=sizes.length;

function match(t){
  if(state.cat.size&&!state.cat.has(t.category))return false;
  if(state.color.size&&!state.color.has(t.colorFamily))return false;
  if(state.finish.size&&!state.finish.has(t.finish))return false;
  if(state.brand.size&&!state.brand.has(t.brand))return false;
  if(state.size.size&&!state.size.has(t.size))return false;
  if(state.q){const hay=((t.name||"")+" "+(t.code||"")+" "+(t.color||"")+" "+(t.brand||"")).toLowerCase();if(!hay.includes(state.q))return false;}
  return true;
}

const grid=document.getElementById('grid');
function render(){
  const list=TILES.filter(match).sort((a,b)=>catRank(a.category)-catRank(b.category)||(a.brand||"").localeCompare(b.brand||"",'ko')||sizeArea(b.size)-sizeArea(a.size));
  document.getElementById('cnt').textContent=list.length;
  document.getElementById('empty').style.display=list.length?'none':'block';
  grid.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(t=>{
    const c=document.createElement('div');c.className='card';c.onclick=()=>openLB(t);
    const dot=COLOR_HEX[t.colorFamily]||'#ccc';
    c.innerHTML=`<div class="cimg"><img loading="lazy" src="${t.img}" alt="${(t.name||'').replace(/"/g,'')}">`
      +(t.category?`<span class="ccat">${t.category}</span>`:'')+`</div>`
      +`<div class="cbody">`
      +(t.brand?`<div class="cbrand">${t.brand}</div>`:'')
      +`<div class="cname">${t.name||t.code||'-'}</div>`
      +`<div class="cmeta"><span class="csize">${t.size||''}</span>`
      +(t.finish?`<span class="cfin">${t.finish}</span>`:'')
      +`<span class="cdot" style="background:${dot}"></span></div>`
      +`</div>`;
    frag.appendChild(c);
  });
  grid.appendChild(frag);
}

// lightbox
const lb=document.getElementById('lb'),lbc=document.getElementById('lb-card');
function row(k,v){return v?`<div class="lb-k">${k}</div><div class="lb-v">${v}</div>`:'';}
function openLB(t){
  const dot=COLOR_HEX[t.colorFamily]||'#ccc';
  lbc.innerHTML=`<div class="lb-img"><img src="${t.img}" alt=""></div>`
    +`<div class="lb-info"><button class="lb-close" aria-label="닫기">×</button>`
    +(t.category?`<div class="lb-cat">${t.category}</div>`:'')
    +(t.brand?`<div class="lb-brand">${t.brand}</div>`:'')
    +`<div class="lb-name">${t.name||t.code||'-'}</div>`
    +(t.colorFamily?`<div class="lb-color"><span class="cdot" style="width:12px;height:12px;background:${dot}"></span>${t.colorFamily}${t.color?' · '+t.color:''}</div>`:'')
    +`<div class="lb-specs">`
    +row('규격',t.size)+row('두께',t.thickness)+row('마감',t.finish)+row('코드',t.code)
    +row('Pcs/Box',t.pcsPerBox)+row('m²/Box',t.sqmPerBox)+row('Kg/Box',t.kgPerBox)+row('Box/Pt',t.boxPerPt)
    +row('카탈로그',t.catalogPage?('p.'+t.catalogPage):'')
    +`</div></div>`;
  lbc.querySelector('.lb-close').onclick=closeLB;
  lb.classList.add('open');
}
function closeLB(){lb.classList.remove('open');}
lb.onclick=e=>{if(e.target===lb)closeLB();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();});

render();
</script>
</body>
</html>
